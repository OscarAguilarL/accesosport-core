<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: auto; color: #111827;">

  <h2 style="color: #2563eb;">Recuperación de contraseña — AccesoSport</h2>
  <p>Recibimos una solicitud para restablecer la contraseña de tu cuenta.</p>

  <div style="margin: 24px 0;">
    <a th:href="${resetLink}"
       style="display: inline-block; background-color: #2563eb; color: #ffffff; padding: 12px 24px;
              text-decoration: none; border-radius: 6px; font-weight: bold;">
      Restablecer mi contraseña
    </a>
  </div>

  <p>Este enlace expira en <strong>1 hora</strong>.</p>
  <p>Si no solicitaste este cambio, ignora este mensaje. Tu contraseña no será modificada.</p>

  <p style="color: #6b7280; font-size: 12px;">AccesoSport — Tu carrera, tu momento.</p>

</body>
</html>
